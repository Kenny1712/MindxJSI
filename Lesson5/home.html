<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Store - Trang chủ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-100 px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-10">
        <div class="flex items-center gap-2">
            <i class="fas fa-mobile-alt text-blue-600 text-xl"></i>
            <span class="font-bold text-xl">Phone Store <span class="text-blue-600 font-black">PRO</span></span>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right hidden sm:block">
                <p id="nav-user-name" class="font-bold text-sm text-gray-800 leading-none mb-1"></p>
                <p id="nav-user-role" class="text-[10px] font-black uppercase tracking-widest text-gray-400"></p>
            </div>
            <img id="nav-user-photo" src="" class="w-10 h-10 rounded-full border-2 border-blue-50">
            <button id="logout-btn" class="p-2 text-gray-400 hover:text-red-500 transition-colors">
                <i class="fas fa-sign-out-alt text-lg"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-5xl mx-auto w-full">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Profile Column -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 self-start">
                <h3 class="font-bold text-gray-400 text-xs uppercase mb-4 tracking-widest text-center">Tài khoản cá nhân</h3>
                <div class="text-center">
                    <img id="home-user-photo" src="" class="w-24 h-24 rounded-3xl border-4 border-white shadow-xl mx-auto mb-4">
                    <h4 id="home-user-name" class="font-bold text-lg text-gray-800"></h4>
                    <p id="home-user-email" class="text-sm text-gray-500 mb-4"></p>
                    <div id="role-badge" class="inline-block px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider"></div>
                </div>
            </div>

            <!-- Content Column -->
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Bảng điều khiển</h2>
                    <p class="text-gray-500 mb-8">Quản lý danh mục sản phẩm và đơn hàng của bạn.</p>
                    
                    <div class="bg-slate-50 rounded-2xl p-10 border-2 border-dashed border-gray-200 text-center">
                        <div class="bg-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                            <i class="fas fa-shield-alt text-2xl text-blue-500"></i>
                        </div>
                        <h4 class="font-bold text-gray-700 mb-2">Xác thực quyền hạn</h4>
                        <p class="text-sm text-gray-500 mb-8 max-w-xs mx-auto">Chỉ Admin mới có quyền truy cập vào các công cụ chỉnh sửa dữ liệu nâng cao.</p>
                        
                        <button id="admin-edit-btn" class="bg-gray-900 hover:bg-black text-white px-8 py-3.5 rounded-xl font-bold transition-all shadow-xl flex items-center gap-2 mx-auto">
                            <i class="fas fa-edit"></i> Chỉnh sửa sản phẩm
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgLjZQHmZQoLWYDepZ6Giywpfrk4zx8U0",
            authDomain: "phone-store-bf10d.firebaseapp.com",
            projectId: "phone-store-bf10d",
            storageBucket: "phone-store-bf10d.firebasestorage.app",
            messagingSenderId: "528404074319",
            appId: "1:528404074319:web:2fb4661b870feef8de3f3a",
            measurementId: "G-0WDL5NHVNZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                // Logic Admin: Email có chứa chữ "admin"
                const isAdmin = user.email && user.email.toLowerCase().includes('admin');
                const avatar = user.photoURL || `https://ui-avatars.com/api/?name=${user.email}&background=random`;
                const name = user.displayName || user.email.split('@')[0];

                // Cập nhật giao diện
                document.getElementById('nav-user-name').textContent = name;
                document.getElementById('nav-user-role').textContent = isAdmin ? "Administrator" : "Member";
                document.getElementById('nav-user-photo').src = avatar;
                document.getElementById('home-user-name').textContent = name;
                document.getElementById('home-user-email').textContent = user.email;
                document.getElementById('home-user-photo').src = avatar;

                const badge = document.getElementById('role-badge');
                badge.textContent = isAdmin ? "Admin Access" : "Basic Member";
                badge.className = isAdmin ? "bg-red-100 text-red-600 border border-red-200" : "bg-blue-100 text-blue-600 border border-blue-200";

                // Xử lý nút Edit theo yêu cầu của bạn
                document.getElementById('admin-edit-btn').onclick = () => {
                    if (isAdmin) {
                        alert("Xác nhận: OK! Bạn là Admin.");
                    } else {
                        alert("Lỗi: Bạn không có quyền truy cập khu vực này!");
                    }
                };
            }
        });

        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => {
                window.location.href = 'login.html';
            });
        };
    </script>
</body>
</html>
