<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Store - Đăng ký</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">Tạo tài khoản mới</h1>
            <p class="text-gray-500 text-sm">Tham gia cộng đồng Phone Store</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Địa chỉ Email</label>
                <input type="email" id="email-input" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition-all" placeholder="your@email.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Mật khẩu</label>
                <input type="password" id="pass-input" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition-all" placeholder="Tối thiểu 6 ký tự">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Xác nhận mật khẩu</label>
                <input type="password" id="confirm-pass-input" class="w-full border-2 border-gray-100 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition-all" placeholder="Nhập lại mật khẩu">
            </div>
            <button id="email-reg-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-100 mt-4">Đăng ký tài khoản</button>
        </div>

        <p class="text-center mt-8 text-sm text-gray-500">
            Đã có tài khoản? <a href="login.html" class="text-blue-600 font-bold hover:underline">Đăng nhập</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgLjZQHmZQoLWYDepZ6Giywpfrk4zx8U0",
            authDomain: "phone-store-bf10d.firebaseapp.com",
            projectId: "phone-store-bf10d",
            storageBucket: "phone-store-bf10d.firebasestorage.app",
            messagingSenderId: "528404074319",
            appId: "1:528404074319:web:2fb4661b870feef8de3f3a",
            measurementId: "G-0WDL5NHVNZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'home.html';
        });

        document.getElementById('email-reg-btn').onclick = async () => {
            const email = document.getElementById('email-input').value;
            const pass = document.getElementById('pass-input').value;
            const confirm = document.getElementById('confirm-pass-input').value;

            if (pass !== confirm) return alert("Mật khẩu xác nhận không khớp!");
            if (pass.length < 6) return alert("Mật khẩu phải từ 6 ký tự!");

            try { 
                await createUserWithEmailAndPassword(auth, email, pass);
                alert("Đăng ký thành công!");
            } catch (e) { 
                alert(e.message); 
            }
        };
    </script>
</body>
</html>
