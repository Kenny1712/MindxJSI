<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <style>
    body {
  background: linear-gradient(to right, #74ebd5, #9face6);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.weather-app {
  background: #fff;
  padding: 20px;
  width: 350px;
  border-radius: 12px;
  text-align: center;
}

.search-box {
  display: flex;
  gap: 10px;
}

.search-box input {
  flex: 1;
  padding: 8px;
}

.search-box button {
  padding: 8px 12px;
  cursor: pointer;
}

.current-weather h1 {
  font-size: 48px;
  margin: 10px 0;
}

.forecast {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  margin-top: 15px;
}

.forecast-item {
  background: #f2f2f2;
  padding: 10px;
  border-radius: 8px;
  min-width: 80px;
}

  </style>
</head>
<body>

  <div class="weather-app">
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Nhập tên thành phố">
      <button onclick="getWeather()">Tìm</button>
    </div>

    <div class="current-weather">
      <h2 id="cityName">---</h2>
      <p id="localTime">--:--</p>
      <h1 id="temperature">--°C</h1>
      <p id="description">---</p>
    </div>

    <div class="forecast" id="forecast"></div>
  </div>

  <script>
    const API_KEY = "2d68e91d199f589f581437bac4143b6d";

function getWeather() {
  const city = document.getElementById("cityInput").value;
  if (!city) return alert("Nhập tên thành phố đi 😑");

  fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric&lang=vi`)
    .then(res => res.json())
    .then(data => {
      document.getElementById("cityName").innerText = data.name;
      document.getElementById("temperature").innerText = `${Math.round(data.main.temp)}°C`;
      document.getElementById("description").innerText = data.weather[0].description;
      const localTime = new Date((data.dt + data.timezone) * 1000);
      document.getElementById("localTime").innerText =
        localTime.toUTCString().slice(17, 22);
    });

  fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric&lang=vi`)
    .then(res => res.json())
    .then(data => {
      const forecastDiv = document.getElementById("forecast");
      forecastDiv.innerHTML = "";

      for (let i = 0; i < data.list.length; i += 8) {
        const item = data.list[i];
        const time = item.dt_txt.split(" ")[0];

        forecastDiv.innerHTML += `
          <div class="forecast-item">
            <p>${time}</p>
            <p>${Math.round(item.main.temp)}°C</p>
          </div>
        `;
      }
    });
}

  </script>
</body>
</html>
